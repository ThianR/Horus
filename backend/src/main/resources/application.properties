server.port=8000
spring.application.name=oculus-asistencia

# Datasource Configuration (H2 File-based for persistence, supports ENV overriding)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/oculus_db;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}


# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Console H2 (optional for dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
