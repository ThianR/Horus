server.port=8000
spring.application.name=oculus-asistencia

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.file.name=temp/oculus-asistencia.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# CORS Configuration (Permite acceso local y por IP de red)
app.cors.allowed-origins=*

# Datasource Configuration (H2 File-based for persistence, supports ENV overriding)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/oculus_db;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}


# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:18000000}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Biometria Python Service
biometria.python.url=http://127.0.0.1:8001

# Console H2 (optional for dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
